{# title: Map #}
{% extends "base.html" %}
{% block title %}GR6 — ArUco Map{% endblock %}

{% block content %}
<div id="map-wrapper" style="position: relative; width: 100%;">
  <canvas id="map-canvas" style="display: block; width: 100%; height: 100%;"></canvas>

  <div class="btn-group-vertical position-absolute top-0 end-0 m-2" role="group">
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="auto">Auto</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="1">1 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="2">2 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="5">5 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="10">10 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="20">20 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="50">50 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="100">100 m</button>
    <button type="button" class="btn btn-sm zoom-btn" data-zoom="200">200 m</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/geomap.js"></script>
<script>
// Migrated onto the shared map widget (2026-09-13) - this page (plus
// navigate's own old Run page) was one of the two independent
// hand-rolled implementations geomap.js's own header comment mentions
// existed before being promoted into a shared module; this was the one
// consumer that never actually got migrated at the time. Doing so now
// picks up drag-to-pan/wheel-zoom for free, and drops a near-duplicate
// copy of the gridline/scale-bar/projection code. One behaviour
// difference: with no fix yet and no known markers, this used to centre
// on the *mean* of the known markers rather than falling back to
// geomap.js's own generic "first plotted point of any layer" - a purely
// cosmetic difference in an edge case (no GNSS fix at all yet).
const map = createGeoMap(document.getElementById("map-canvas"), document.getElementById("map-wrapper"), ".zoom-btn");
map.setZoom("auto");

const trail = []; // [{lat, lon}]
const MAX_TRAIL_POINTS = 2000;

function loadMarkerMap() {
  fetch("/marker-map")
    .then((r) => r.json())
    .then((markers) => {
      map.setLayer("known", markers.map((m) => ({ lat: m.lat, lon: m.lon, id: m.id })), {
        color: "#198754", line: false, dots: true, dotRadius: 5, labels: true, labelFn: (p) => p.id,
      });
      map.resize();
    });
}

connectWsUrl("{{ oxtsnav_ws_url }}", (msg) => {
  const nav = msg.nav || {};
  if (nav.Lat === undefined || nav.Lon === undefined) return;
  const current = { lat: (nav.Lat * 180) / Math.PI, lon: (nav.Lon * 180) / Math.PI };
  trail.push(current);
  if (trail.length > MAX_TRAIL_POINTS) trail.shift();
  map.setLayer("trail", trail, { color: "#0d6efd", dots: false });
  map.setCurrent(current.lat, current.lon);
  map.draw();
});

connectWs("/ws/aruco", (msg) => {
  const unmapped = Object.entries(msg.unmapped || {}).map(([id, m]) => ({ lat: m.lat, lon: m.lon, id }));
  map.setLayer("unmapped", unmapped, { color: "#adb5bd", line: false, dots: true, dotRadius: 5, labels: true, labelFn: (p) => p.id });
  map.draw();
});

loadMarkerMap();
map.resize();
</script>
{% endblock %}
