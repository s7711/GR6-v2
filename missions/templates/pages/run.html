{# title: Run #}
{% extends "base.html" %}
{% block title %}GR6 — Missions{% endblock %}

{% block content %}
<div class="row g-3 mb-3">
  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label">Mission</label>
          <select id="mission-select" class="form-select">
            <option value="">-- choose a mission --</option>
            {% for m in missions %}
            <option value="{{ m.name }}">{{ m.name }} ({{ m.step_count }} jobs)</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Start from job</label>
          <select id="start-step" class="form-select"></select>
        </div>
        <button id="start-btn" class="btn btn-success me-2">Start</button>
        <button id="stop-btn" class="btn btn-danger">Stop</button>
        <div id="start-message" class="text-body-secondary small mt-2"></div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body">
        <table class="table table-sm mb-0">
          <tbody>
            <tr><th scope="row">Mission</th><td><span id="stat-mission_name">—</span></td></tr>
            <tr><th scope="row">State</th><td><span id="stat-state">—</span> <span id="stat-abort_reason" class="text-danger small"></span></td></tr>
            <tr><th scope="row">Job</th><td><span id="stat-current_step_index">—</span> / <span id="stat-step_count">—</span> <span id="stat-step-desc" class="text-body-secondary small"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div id="map-wrapper" style="position: relative; width: 100%;">
      <canvas id="map-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
      <div class="btn-group-vertical position-absolute top-0 end-0 m-2" role="group">
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="auto">Auto</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="2">2 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="5">5 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="10">10 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="20">20 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="50">50 m</button>
      </div>

      <div class="position-absolute bottom-0 start-0 m-3 text-center" style="opacity: 0.9;">
        <div id="joystick" style="touch-action: none; width: 200px; height: 200px; background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); border-radius: 0.5rem; position: relative; cursor: grab;">
          <div id="joystick-thumb" style="width: 50px; height: 50px; border-radius: 50%; background: var(--bs-primary); position: absolute; left: 75px; top: 75px; pointer-events: none;"></div>
        </div>
        <div class="text-body-secondary small mt-1">Drag to jog into position, release to stop</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/geomap.js"></script>
<script src="/static/jog.js"></script>
<script>
createJoystick(document.getElementById("joystick"), document.getElementById("joystick-thumb"), {
  postUrl: "/jog/manual",
  maxSpeedMps: 0.8,
});
</script>
<script>
// Draws every job in the mission at once (added 2026-09-13 - the
// previous version only ever drew the upcoming job, so the map looked
// empty/wrong for most of a mission's run): the job that's actually
// current (the live current_step_index while running, otherwise
// whichever the "Start from job" dropdown has selected) at full
// opacity, every other job faded - a glance says both "where's it
// going right now" and "what's the whole round". Colour still cycles
// by step index within a job (same as jobs' own Run page), so a job
// that reuses a path for two steps still tells them apart.
const STEP_COLORS_RGB = [[13, 110, 253], [220, 53, 69], [25, 135, 84], [253, 126, 20], [111, 66, 193]];
const CURRENT_JOB_ALPHA = 0.9;
const OTHER_JOB_ALPHA = 0.3;
function stepColor(i, alpha) {
  const [r, g, b] = STEP_COLORS_RGB[i % STEP_COLORS_RGB.length];
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

const pathPointsCache = {};
const jobCache = {}; // job name -> {"steps": [...]} - a job's own steps don't depend on which mission references it, so this outlives a single mission selection
let currentSteps = []; // [{type: "run_job", job: "..."}, ...] - set whenever a mission's steps are fetched
let lastRenderedCurrentIndex = null; // whichever mission step is drawn at full opacity - live current_step_index while running, else the "Start from job" selection

const missionSelect = document.getElementById("mission-select");
const startStepSelect = document.getElementById("start-step");
const map = createGeoMap(document.getElementById("map-canvas"), document.getElementById("map-wrapper"), ".zoom-btn");
map.setZoom("auto");

// Rebuilds the "Start from job" dropdown from currentSteps (already
// fetched by refreshMissionSteps) so each entry reads e.g. "2 (water-the-tomatoes)"
// - same idea as jobs' own Run page (2026-08-18).
function fillStartSteps() {
  const selected = startStepSelect.value;
  startStepSelect.innerHTML = "";
  currentSteps.forEach((step, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${i} (${stepDescription(i)})`;
    startStepSelect.appendChild(o);
  });
  if (selected && [...startStepSelect.options].some((o) => o.value === selected)) {
    startStepSelect.value = selected;
  }
}

// Draws every job in the mission - currentIndex (whichever job is
// actually current, live or just selected to start from - see below)
// full opacity, every other job faded. Layer keys are per (mission
// step, job step) pair rather than a plain count, so a mission whose
// jobs have different step counts (the normal case) still clears
// exactly the layers that no longer apply, not just a shrinking tail.
let lastRenderedLayers = [];
function redrawMissionMap(currentIndex) {
  const layers = [];
  currentSteps.forEach((step, stepIndex) => {
    const job = jobCache[step.job];
    if (!job) return;
    const alpha = stepIndex === currentIndex ? CURRENT_JOB_ALPHA : OTHER_JOB_ALPHA;
    job.steps.forEach((jobStep, jobStepIndex) => {
      if (!jobStep.path) return;
      const key = `mission-${stepIndex}-path-${jobStepIndex}`;
      const points = pathPointsCache[jobStep.path] || [];
      map.setLayer(key, points, { color: stepColor(jobStepIndex, alpha), dots: true, dotRadius: 3 });
      layers.push(key);
    });
  });
  lastRenderedLayers.filter((key) => !layers.includes(key)).forEach((key) => map.setLayer(key, []));
  lastRenderedLayers = layers;
  map.resize();
}

// Fetches (and caches) every job the mission references, then every
// path any of those jobs reference, then draws - reselecting a mission
// already seen before redraws instantly from cache.
function loadJobsAndRedraw() {
  const jobNames = [...new Set(currentSteps.map((s) => s.job))];
  const jobsToFetch = jobNames.filter((n) => !(n in jobCache));
  Promise.all(jobsToFetch.map((name) =>
    fetch(`/api/jobs/${encodeURIComponent(name)}`).then((r) => (r.ok ? r.json() : null)).then((job) => { jobCache[name] = job; })
  )).then(() => {
    const pathNames = new Set();
    currentSteps.forEach((s) => {
      const job = jobCache[s.job];
      (job ? job.steps : []).forEach((js) => { if (js.path) pathNames.add(js.path); });
    });
    const toFetch = [...pathNames].filter((n) => !(n in pathPointsCache));
    Promise.all(toFetch.map((pathName) =>
      fetch(`/api/navigate-paths/${encodeURIComponent(pathName)}`)
        .then((r) => (r.ok ? r.json() : []))
        .then((points) => { pathPointsCache[pathName] = points; })
    )).then(() => {
      lastRenderedCurrentIndex = parseInt(startStepSelect.value || "0", 10);
      redrawMissionMap(lastRenderedCurrentIndex);
    });
  });
}

function refreshMissionSteps() {
  const name = missionSelect.value;
  if (!name) {
    currentSteps = [];
    fillStartSteps();
    lastRenderedCurrentIndex = null;
    redrawMissionMap(null);
    return;
  }
  fetch(`/api/missions/${encodeURIComponent(name)}`).then((r) => (r.ok ? r.json() : null)).then((mission) => {
    currentSteps = mission ? mission.steps : [];
    fillStartSteps();
    loadJobsAndRedraw();
  });
}

missionSelect.addEventListener("change", refreshMissionSteps);
startStepSelect.addEventListener("change", () => {
  // Only matters while idle - once running, the live current_step_index
  // from /ws/missions below takes over.
  lastRenderedCurrentIndex = parseInt(startStepSelect.value || "0", 10);
  redrawMissionMap(lastRenderedCurrentIndex);
});

const preselect = new URLSearchParams(window.location.search).get("mission");
if (preselect) missionSelect.value = preselect;
refreshMissionSteps();
map.resize();

document.getElementById("start-btn").addEventListener("click", () => {
  const name = missionSelect.value;
  if (!name) { alert("Choose a mission first."); return; }
  const start_index = parseInt(startStepSelect.value || "0", 10);
  fetch("/control/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, start_index }),
  }).then((r) => r.json()).then((result) => {
    document.getElementById("start-message").textContent = result.ok === false ? (result.reason || "Couldn't start.") : "";
  });
});

document.getElementById("stop-btn").addEventListener("click", () => {
  fetch("/control/stop", { method: "POST" });
});

function stepDescription(index) {
  const step = currentSteps[index];
  return step ? step.job : "";
}

const joystickEl = document.getElementById("joystick");

connectWs("/ws/missions", (msg) => {
  fillFields("stat-", msg);
  document.getElementById("stat-step-desc").textContent = stepDescription(msg.current_step_index);
  // Same reasoning as navigate's/jobs' own Run pages: jogging while a
  // step is actually driving would fight its auto commands via
  // drive's control arbiter - the joystick here is only for lining up
  // before Start.
  const running = msg.state === "running";
  joystickEl.style.pointerEvents = running ? "none" : "auto";
  joystickEl.style.opacity = running ? "0.4" : "1";

  // Which job the map highlights at full opacity: the live
  // current_step_index while a mission is actually running, otherwise
  // whatever "Start from job" has selected (handled by its own change
  // listener above) - only redraw on an actual change, not every
  // /ws/missions tick.
  const effectiveIndex = running ? msg.current_step_index : parseInt(startStepSelect.value || "0", 10);
  if (effectiveIndex !== lastRenderedCurrentIndex) {
    lastRenderedCurrentIndex = effectiveIndex;
    redrawMissionMap(effectiveIndex);
  }
});

// --- Live trail: where the robot has actually been, same mechanism as
// navigate's/jobs' own Run pages (connects straight to oxts-nav's
// feed, not proxied - a WebSocket isn't subject to CORS the way a
// fetch() is).

const trail = [];
const MAX_TRAIL_POINTS = 2000;

connectWsUrl("{{ oxtsnav_ws_url }}", (msg) => {
  const nav = msg.nav || {};
  if (nav.Lat !== undefined && nav.Lon !== undefined) {
    const current = { lat: (nav.Lat * 180) / Math.PI, lon: (nav.Lon * 180) / Math.PI };
    trail.push(current);
    if (trail.length > MAX_TRAIL_POINTS) trail.shift();
    map.setLayer("trail", trail, { color: "#0d6efd" });
    map.setCurrent(current.lat, current.lon);
    map.draw();
  }
});
</script>
{% endblock %}
