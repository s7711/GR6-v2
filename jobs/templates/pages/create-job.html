{# title: Create Job #}
{% extends "base.html" %}
{% block title %}GR6 — Create Job{% endblock %}

{% block content %}
<div class="card mb-3">
  <div class="card-body">
    <h5 id="page-heading">New job</h5>

    <div id="warnings" class="alert alert-warning d-none"></div>

    <table class="table align-middle">
      <thead><tr><th>#</th><th>Colour</th><th>Step</th><th></th></tr></thead>
      <tbody id="steps-body"></tbody>
    </table>

    <button id="add-path" class="btn btn-outline-primary btn-sm">Add path</button>
    <button id="add-step" class="btn btn-outline-primary btn-sm ms-2">Add step&hellip;</button>
    <button id="save-btn" class="btn btn-success ms-2">Save&hellip;</button>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div id="map-wrapper" style="position: relative; width: 100%;">
      <canvas id="map-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
      <div class="btn-group-vertical position-absolute top-0 end-0 m-2" role="group">
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="auto">Auto</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="5">5 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="20">20 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="50">50 m</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="step-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add step</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Type</label>
        <select id="step-type" class="form-select mb-3">
          <option value="pause">Pause</option>
          <option value="water">Water (stationary)</option>
          <option value="fill">Fill water butt</option>
        </select>
        <label class="form-label">Duration</label>
        <select id="step-duration" class="form-select"></select>
      </div>
      <div class="modal-footer">
        <button id="step-modal-add" type="button" class="btn btn-success">Add</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="save-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Save job</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Filename</label>
        <input id="save-filename" type="text" class="form-control">
        <div id="save-overwrite-note" class="text-warning small mt-2 d-none">
          A job with this name already exists — saving will overwrite it.
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-continue" type="button" class="btn btn-outline-success">Save and continue</button>
        <button id="save-exit" type="button" class="btn btn-success">Save and exit</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/geomap.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const jobName = params.get("name");

// Cycled by step index, not by path name — two steps using the same
// path (e.g. the same bed driven twice) still get distinct colours, so
// the "which line is which step" question the map exists to answer
// stays answerable even then.
const STEP_COLORS = ["#0d6efd", "#dc3545", "#198754", "#fd7e14", "#6f42c1"];

const STEP_LABELS = { pause: "Pause", water: "Water (stationary)", fill: "Fill water butt" };
// Fill is a real waterbutt API call (see waterbutt/control.py's own
// DURATIONS_S allow-list) - 60s isn't one of the values it accepts, so
// it gets its own shorter list rather than a duration that would always
// be refused at run time. Pause/water have no such restriction.
const DURATION_OPTIONS_S = { pause: [5, 10, 20, 60], water: [5, 10, 20, 60], fill: [5, 10, 20, 50] };

let steps = []; // [{type: "run_path", path: "..."}, {type: "pause"|"water"|"fill", duration_s: N}]
let dirty = false;
let existingNames = [];
let navigatePaths = [];
const pathPointsCache = {}; // path name -> points, fetched lazily as steps reference it

const stepsBody = document.getElementById("steps-body");
const map = createGeoMap(document.getElementById("map-canvas"), document.getElementById("map-wrapper"), ".zoom-btn");
map.setZoom("auto");

function pathOptionsHtml(selected) {
  return navigatePaths.map((p) => {
    const sel = p.name === selected ? "selected" : "";
    return `<option value="${p.name}" ${sel}>${p.name}</option>`;
  }).join("");
}

function stepCellHtml(step) {
  if (step.type === "run_path") {
    return `<select class="form-select form-select-sm step-path">${pathOptionsHtml(step.path)}</select>`;
  }
  return `${STEP_LABELS[step.type]} &mdash; ${step.duration_s}s`;
}

function renderSteps() {
  stepsBody.innerHTML = "";
  steps.forEach((step, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i}</td>
      <td><div style="width: 1.5rem; height: 1.5rem; border-radius: 4px; background-color: ${STEP_COLORS[i % STEP_COLORS.length]};"></div></td>
      <td>${stepCellHtml(step)}</td>
      <td class="text-nowrap">
        <button class="btn btn-sm btn-outline-secondary step-up" ${i === 0 ? "disabled" : ""}>&uarr;</button>
        <button class="btn btn-sm btn-outline-secondary step-down" ${i === steps.length - 1 ? "disabled" : ""}>&darr;</button>
        <button class="btn btn-sm btn-outline-danger step-remove">Remove</button>
      </td>
    `;
    const pathSelect = tr.querySelector(".step-path");
    if (pathSelect) {
      pathSelect.addEventListener("change", (e) => {
        steps[i].path = e.target.value;
        dirty = true;
        updateMap();
      });
    }
    tr.querySelector(".step-up").addEventListener("click", () => {
      [steps[i - 1], steps[i]] = [steps[i], steps[i - 1]];
      dirty = true;
      renderSteps();
    });
    tr.querySelector(".step-down").addEventListener("click", () => {
      [steps[i], steps[i + 1]] = [steps[i + 1], steps[i]];
      dirty = true;
      renderSteps();
    });
    tr.querySelector(".step-remove").addEventListener("click", () => {
      steps.splice(i, 1);
      dirty = true;
      renderSteps();
    });
    stepsBody.appendChild(tr);
  });
  updateMap();
}

// Fetches (and caches) whichever paths the current steps reference,
// then draws one layer per step — reordering/removing steps redraws
// instantly from cache; only genuinely new path names hit the network.
let lastRenderedStepCount = 0;
function updateMap() {
  const names = [...new Set(steps.map((s) => s.path).filter(Boolean))];
  const toFetch = names.filter((n) => !(n in pathPointsCache));
  Promise.all(toFetch.map((name) =>
    fetch(`/api/navigate-paths/${encodeURIComponent(name)}`)
      .then((r) => (r.ok ? r.json() : []))
      .then((points) => { pathPointsCache[name] = points; })
  )).then(() => {
    steps.forEach((step, i) => {
      const points = pathPointsCache[step.path] || [];
      map.setLayer(`step-${i}`, points, { color: STEP_COLORS[i % STEP_COLORS.length], dots: true, dotRadius: 3 });
    });
    for (let i = steps.length; i < lastRenderedStepCount; i++) {
      map.setLayer(`step-${i}`, []);
    }
    lastRenderedStepCount = steps.length;
    map.resize();
  });
}

document.getElementById("add-path").addEventListener("click", () => {
  steps.push({ type: "run_path", path: navigatePaths.length ? navigatePaths[0].name : "" });
  dirty = true;
  renderSteps();
});

// --- Add step (pause/water/fill) modal ---

const stepModalEl = document.getElementById("step-modal");
const stepModal = new bootstrap.Modal(stepModalEl);
const stepTypeSelect = document.getElementById("step-type");
const stepDurationSelect = document.getElementById("step-duration");

function fillStepDurationOptions() {
  const options = DURATION_OPTIONS_S[stepTypeSelect.value];
  stepDurationSelect.innerHTML = options.map((s) => `<option value="${s}">${s}s</option>`).join("");
}
stepTypeSelect.addEventListener("change", fillStepDurationOptions);

document.getElementById("add-step").addEventListener("click", () => {
  fillStepDurationOptions();
  stepModal.show();
});

document.getElementById("step-modal-add").addEventListener("click", () => {
  steps.push({ type: stepTypeSelect.value, duration_s: parseInt(stepDurationSelect.value, 10) });
  dirty = true;
  stepModal.hide();
  renderSteps();
});

// --- Save dialog ---

const saveModalEl = document.getElementById("save-modal");
const saveModal = new bootstrap.Modal(saveModalEl);

function updateOverwriteNote() {
  const name = document.getElementById("save-filename").value.trim();
  const overwriting = existingNames.includes(name);
  document.getElementById("save-overwrite-note").classList.toggle("d-none", !overwriting);
  const label = overwriting ? "Overwrite and " : "Save and ";
  document.getElementById("save-continue").textContent = label + "continue";
  document.getElementById("save-exit").textContent = label + "exit";
}
document.getElementById("save-filename").addEventListener("input", updateOverwriteNote);

document.getElementById("save-btn").addEventListener("click", () => {
  if (steps.length === 0) { alert("Add at least one step first."); return; }
  fetch("/api/jobs").then((r) => r.json()).then((list) => {
    existingNames = list.map((m) => m.name);
    document.getElementById("save-filename").value = jobName || "";
    updateOverwriteNote();
    saveModal.show();
  });
});

function showWarnings(warnings) {
  const box = document.getElementById("warnings");
  if (!warnings.length) { box.classList.add("d-none"); return; }
  box.innerHTML = "Some steps may not run back-to-back:<ul class='mb-0'>" +
    warnings.map((w) =>
      `<li>Step ${w.after_step} (${w.from_path}) &rarr; step ${w.after_step + 1} (${w.to_path}): ` +
      `${w.distance_m.toFixed(2)}m away, ${w.heading_error_deg.toFixed(0)}&deg; off heading.</li>`
    ).join("") + "</ul>";
  box.classList.remove("d-none");
}

function doSave(thenExit) {
  const name = document.getElementById("save-filename").value.trim();
  if (!name) { alert("Enter a filename."); return; }
  fetch(`/api/jobs/${encodeURIComponent(name)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ steps }),
  }).then((r) => {
    if (!r.ok) { alert("Couldn't save (need at least one step, or an invalid name)."); return null; }
    return r.json();
  }).then((result) => {
    if (!result) return;
    dirty = false;
    saveModal.hide();
    showWarnings(result.warnings);
    if (thenExit) {
      window.location.href = "/pages/jobs";
    } else {
      window.history.replaceState(null, "", `?name=${encodeURIComponent(name)}`);
      document.getElementById("page-heading").textContent = `Editing: ${name}`;
    }
  });
}
document.getElementById("save-continue").addEventListener("click", () => doSave(false));
document.getElementById("save-exit").addEventListener("click", () => doSave(true));

window.addEventListener("beforeunload", (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = "";
});

// --- Load ---

fetch("/api/navigate-paths").then((r) => r.json()).then((list) => {
  navigatePaths = list;

  if (jobName) {
    document.getElementById("page-heading").textContent = `Editing: ${jobName}`;
    fetch(`/api/jobs/${encodeURIComponent(jobName)}`).then((r) => {
      if (!r.ok) return null;
      return r.json();
    }).then((job) => {
      if (job) steps = job.steps;
      renderSteps();
    });
  } else {
    renderSteps();
  }
});
</script>
{% endblock %}
