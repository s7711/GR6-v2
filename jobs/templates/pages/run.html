{# title: Run #}
{% extends "base.html" %}
{% block title %}GR6 — Jobs{% endblock %}

{% block content %}
<div class="row g-3 mb-3">
  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label">Job</label>
          <select id="job-select" class="form-select">
            <option value="">-- choose a job --</option>
            {% for m in jobs %}
            <option value="{{ m.name }}">{{ m.name }} ({{ m.step_count }} steps)</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Start from step</label>
          <select id="start-step" class="form-select"></select>
        </div>
        <button id="start-btn" class="btn btn-success me-2">Start</button>
        <button id="stop-btn" class="btn btn-danger">Stop</button>
        <div id="start-message" class="text-body-secondary small mt-2"></div>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body">
        <table class="table table-sm mb-0">
          <tbody>
            <tr><th scope="row">Job</th><td><span id="stat-job_name">—</span></td></tr>
            <tr><th scope="row">State</th><td><span id="stat-state">—</span> <span id="stat-abort_reason" class="text-danger small"></span></td></tr>
            <tr><th scope="row">Step</th><td><span id="stat-current_step_index">—</span> / <span id="stat-step_count">—</span> <span id="stat-step-desc" class="text-body-secondary small"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div id="map-wrapper" style="position: relative; width: 100%;">
      <canvas id="map-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
      <div class="btn-group-vertical position-absolute top-0 end-0 m-2" role="group">
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="auto">Auto</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="2">2 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="5">5 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="10">10 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="20">20 m</button>
        <button type="button" class="btn btn-sm zoom-btn" data-zoom="50">50 m</button>
      </div>

      <div class="position-absolute bottom-0 start-0 m-3 text-center" style="opacity: 0.9;">
        <div id="joystick" style="touch-action: none; width: 200px; height: 200px; background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); border-radius: 0.5rem; position: relative; cursor: grab;">
          <div id="joystick-thumb" style="width: 50px; height: 50px; border-radius: 50%; background: var(--bs-primary); position: absolute; left: 75px; top: 75px; pointer-events: none;"></div>
        </div>
        <div class="text-body-secondary small mt-1">Drag to jog into position, release to stop</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/geomap.js"></script>
<script src="/static/jog.js"></script>
<script>
createJoystick(document.getElementById("joystick"), document.getElementById("joystick-thumb"), {
  postUrl: "/jog/manual",
  maxSpeedMps: 0.8,
});
</script>
<script>
// Same step-colour cycling as Create/Edit Job's own preview map — see
// that page's comment: cycled by step index (not path name) so a job
// that reuses a path for two steps still tells them apart. Faded
// (unlike the full-strength colours there) so the planned steps read
// as background against the live trail below, which uses the same
// blue at full strength for "what actually happened".
const STEP_COLORS = [
  "rgba(13, 110, 253, 0.35)", "rgba(220, 53, 69, 0.35)", "rgba(25, 135, 84, 0.35)",
  "rgba(253, 126, 20, 0.35)", "rgba(111, 66, 193, 0.35)",
];
const STEP_LABELS = { pause: "Pause", water: "Water (stationary)", fill: "Fill water butt", turn_to_heading: "Turn to heading" };
const pathPointsCache = {};
let currentJobSteps = []; // set by updateMap() whenever a job's steps are fetched - reused by the status display below

const jobSelect = document.getElementById("job-select");
const startStepSelect = document.getElementById("start-step");
const map = createGeoMap(document.getElementById("map-canvas"), document.getElementById("map-wrapper"), ".zoom-btn");
map.setZoom("auto");

// Rebuilds the "Start from step" dropdown from currentJobSteps (already
// fetched by updateMap) so each entry reads e.g. "2 (Waterbutt8)" -
// Ben's own idea (2026-08-18): the plain index was fine until jobs got
// longer, at which point knowing *which* path/step you're picking
// without cross-checking the table below it matters a lot more.
function fillStartSteps() {
  const selected = startStepSelect.value;
  startStepSelect.innerHTML = "";
  currentJobSteps.forEach((step, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${i} (${stepDescription(i)})`;
    startStepSelect.appendChild(o);
  });
  if (selected && [...startStepSelect.options].some((o) => o.value === selected)) {
    startStepSelect.value = selected;
  }
}
jobSelect.addEventListener("change", updateMap);

let lastRenderedStepCount = 0;
function updateMap() {
  const name = jobSelect.value;
  if (!name) {
    currentJobSteps = [];
    fillStartSteps();
    for (let i = 0; i < lastRenderedStepCount; i++) map.setLayer(`step-${i}`, []);
    lastRenderedStepCount = 0;
    map.resize();
    return;
  }
  fetch(`/api/jobs/${encodeURIComponent(name)}`).then((r) => (r.ok ? r.json() : null)).then((job) => {
    if (!job) return;
    const steps = job.steps;
    currentJobSteps = steps;
    fillStartSteps();
    const names = [...new Set(steps.map((s) => s.path).filter(Boolean))];
    const toFetch = names.filter((n) => !(n in pathPointsCache));
    Promise.all(toFetch.map((pathName) =>
      fetch(`/api/navigate-paths/${encodeURIComponent(pathName)}`)
        .then((r) => (r.ok ? r.json() : []))
        .then((points) => { pathPointsCache[pathName] = points; })
    )).then(() => {
      steps.forEach((step, i) => {
        const points = pathPointsCache[step.path] || [];
        map.setLayer(`step-${i}`, points, { color: STEP_COLORS[i % STEP_COLORS.length], dots: true, dotRadius: 3 });
      });
      for (let i = steps.length; i < lastRenderedStepCount; i++) {
        map.setLayer(`step-${i}`, []);
      }
      lastRenderedStepCount = steps.length;
      map.resize();
    });
  });
}

const preselect = new URLSearchParams(window.location.search).get("job");
if (preselect) jobSelect.value = preselect;
updateMap();
map.resize();

document.getElementById("start-btn").addEventListener("click", () => {
  const name = jobSelect.value;
  if (!name) { alert("Choose a job first."); return; }
  const start_index = parseInt(startStepSelect.value || "0", 10);
  fetch("/control/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, start_index }),
  }).then((r) => r.json()).then((result) => {
    document.getElementById("start-message").textContent = result.ok === false ? (result.reason || "Couldn't start.") : "";
  });
});

document.getElementById("stop-btn").addEventListener("click", () => {
  fetch("/control/stop", { method: "POST" });
});

function stepDescription(index) {
  const step = currentJobSteps[index];
  if (!step) return "";
  if (step.type === "run_path") return step.path;
  if (step.type === "turn_to_heading") return `${STEP_LABELS[step.type]} (${step.heading_deg}°)`;
  return `${STEP_LABELS[step.type]} (${step.duration_s}s)`;
}

const joystickEl = document.getElementById("joystick");
let displayedJobName = null; // whichever job's steps are currently drawn on the map

connectWs("/ws/jobs", (msg) => {
  fillFields("stat-", msg);
  document.getElementById("stat-step-desc").textContent = stepDescription(msg.current_step_index);
  // Same reasoning as navigate's own Run page: jogging while a step is
  // actually driving would fight its auto commands via drive's control
  // arbiter - the joystick here is only for lining up before Start.
  const running = msg.state === "running";
  joystickEl.style.pointerEvents = running ? "none" : "auto";
  joystickEl.style.opacity = running ? "0.4" : "1";

  // Stay in sync with whatever job is actually running, however it got
  // started - a mission driving this job directly loads it without
  // this page's own dropdown ever being touched, same gap navigate's
  // own Run page had (see navigate-prd.md's "Path entry").
  if (msg.job_name && msg.job_name !== displayedJobName) {
    displayedJobName = msg.job_name;
    if ([...jobSelect.options].some((o) => o.value === msg.job_name)) {
      jobSelect.value = msg.job_name;
    }
    updateMap();
  }
});

// --- Live trail: where the robot has actually been, same mechanism as
// navigate's own Run page (connects straight to oxts-nav's feed, not
// proxied - a WebSocket isn't subject to CORS the way a fetch() is).

const trail = [];
const MAX_TRAIL_POINTS = 2000;

connectWsUrl("{{ oxtsnav_ws_url }}", (msg) => {
  const nav = msg.nav || {};
  if (nav.Lat !== undefined && nav.Lon !== undefined) {
    const current = { lat: (nav.Lat * 180) / Math.PI, lon: (nav.Lon * 180) / Math.PI };
    trail.push(current);
    if (trail.length > MAX_TRAIL_POINTS) trail.shift();
    map.setLayer("trail", trail, { color: "#0d6efd" });
    map.setCurrent(current.lat, current.lon);
    map.draw();
  }
});
</script>
{% endblock %}
